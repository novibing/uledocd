[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "uledocd"
authors = [
    {name = "Stephen Jonke", email = "sjonke@gmail.com"},
]
description = "Cross-platform GUI and CLI for the Comet Pinball LED OCD board for pinball machines"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]
dependencies = [
    "pyserial >= 3.5",
    "ttkbootstrap >= 2.2",
    "platformdirs >= 4.14"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mypkg = ["*.xml", "*.csv"]

[project.gui-scripts]
uledocd = "uledocd_gui:uledocd_gui"

[project.scripts]
uledocd-cli = "uledocd_cli:uledocd_cli"
